name: Build & Release AniHyou iOS IPA

on:
  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:
    inputs:
      target:
        description: 'Upstream Tag, Branch, or Commit SHA (leave empty to auto-detect latest App Store release)'
        required: false
        type: string
        default: ''
      force_rebuild:
        description: 'Force build even if this release was already published'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark published release as Pre-release'
        required: false
        type: boolean
        default: false
      anilist_client_id:
        description: 'Custom AniList Client ID (leave empty to use secret or default)'
        required: false
        type: string
        default: ''
      mal_client_id:
        description: 'Custom MyAnimeList Client ID (leave empty to use secret or default)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check-upstream:
    name: Resolve Target & Check Existing
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      anilist_client_id: ${{ steps.resolve.outputs.anilist_client_id }}
      mal_client_id: ${{ steps.resolve.outputs.mal_client_id }}
    steps:
      - name: Resolve target commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TARGET: ${{ inputs.target }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          IS_PRERELEASE: ${{ inputs.is_prerelease || 'false' }}
          INPUT_ANILIST_ID: ${{ inputs.anilist_client_id }}
          INPUT_MAL_ID: ${{ inputs.mal_client_id }}
          SECRET_ANILIST_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          SECRET_MAL_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          set -euo pipefail

          python3 - << 'PYEOF'
          import os, sys, json, re, urllib.request, subprocess

          upstream_repo = "axiel7/AniHyou-iOS"
          current_repo = os.environ.get("GITHUB_REPOSITORY", "")
          input_target = os.environ.get("INPUT_TARGET", "").strip()
          force_rebuild = os.environ.get("FORCE_REBUILD", "false").lower() == "true"
          is_prerelease = os.environ.get("IS_PRERELEASE", "false").lower() == "true"
          gh_token = os.environ.get("GH_TOKEN", "")

          headers = {"User-Agent": "Mozilla/5.0"}
          if gh_token:
              headers["Authorization"] = f"token {gh_token}"
              headers["Accept"] = "application/vnd.github+json"

          commit_sha = ""
          app_version = ""
          target_source = ""

          if input_target:
              print(f"🎯 Manual target requested: {input_target}")
              # Check if it's a commit SHA, branch, or tag via gh api
              try:
                  url = f"https://api.github.com/repos/{upstream_repo}/commits/{input_target}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      commit_sha = data.get("sha", "")
                      target_source = f"manual-{input_target}"
              except Exception as e:
                  print(f"⚠️ Could not resolve target via direct commit: {e}")
                  commit_sha = input_target
                  target_source = "manual"
          else:
              print("🔍 Auto-detecting latest App Store release for AniHyou...")
              app_id = "1635777325"
              store_version = None
              try:
                  url = f"https://itunes.apple.com/lookup?id={app_id}"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      if data.get("resultCount", 0) > 0:
                          store_version = data["results"][0].get("version")
                          print(f"📱 Apple App Store version: {store_version}")
              except Exception as e:
                  print(f"⚠️ iTunes API lookup failed: {e}")

              # 1. Search GitHub commit matching "build: <store_version>"
              if store_version:
                  try:
                      url = f"https://api.github.com/search/commits?q=repo:{upstream_repo}+%22build:+{store_version}%22"
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          data = json.loads(resp.read().decode("utf-8"))
                          for item in data.get("items", []):
                              msg = item.get("commit", {}).get("message", "")
                              if re.search(rf'^(build|bump):\s*{re.escape(store_version)}\b', msg, re.I):
                                  commit_sha = item.get("sha", "")
                                  app_version = store_version
                                  target_source = f"appstore-{store_version}"
                                  print(f"✅ Found App Store release commit: {commit_sha} ({msg.splitlines()[0]})")
                                  break
                  except Exception as e:
                      print(f"⚠️ GitHub commit search failed: {e}")

              # 2. Fallback: Search latest commits for any 'build: X.Y.Z'
              if not commit_sha:
                  try:
                      url = f"https://api.github.com/repos/{upstream_repo}/commits?per_page=100"
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          commits = json.loads(resp.read().decode("utf-8"))
                          for c in commits:
                              msg = c.get("commit", {}).get("message", "")
                              match = re.search(r'^(build|bump):\s*(\d+\.\d+(?:\.\d+)?)', msg, re.I)
                              if match:
                                  commit_sha = c.get("sha", "")
                                  app_version = match.group(2)
                                  target_source = f"build-commit-{app_version}"
                                  print(f"✅ Found latest build commit: {commit_sha} ({msg.splitlines()[0]})")
                                  break
                  except Exception as e:
                      print(f"⚠️ Commit history fallback failed: {e}")

              # 3. Fallback: HEAD of main
              if not commit_sha:
                  try:
                      url = f"https://api.github.com/repos/{upstream_repo}/commits/main"
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          data = json.loads(resp.read().decode("utf-8"))
                          commit_sha = data.get("sha", "")
                          target_source = "main-head"
                          print(f"ℹ️ Fallback to main branch HEAD: {commit_sha}")
                  except Exception as e:
                      print(f"❌ Failed to resolve main HEAD: {e}")
                      sys.exit(1)

          short_sha = commit_sha[:7]

          # Extract app version from project.pbxproj at commit if not set
          if not app_version:
              try:
                  url = f"https://api.github.com/repos/{upstream_repo}/contents/AniHyou.xcodeproj/project.pbxproj?ref={commit_sha}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      import base64
                      raw_pbx = base64.b64decode(json.loads(resp.read().decode("utf-8")).get("content", "")).decode("utf-8", errors="ignore")
                      mv_match = re.search(r'MARKETING_VERSION\s*=\s*([0-9.]+);', raw_pbx)
                      if mv_match:
                          app_version = mv_match.group(1)
              except Exception:
                  pass

          if not app_version:
              app_version = "1.0.0"

          tag_name = f"v{app_version}-{short_sha}"
          print(f"🏷️ Release Tag: {tag_name} (Version: {app_version}, SHA: {short_sha})")

          # Check if already released
          exists_in_repo = False
          if current_repo:
              try:
                  url = f"https://api.github.com/repos/{current_repo}/releases/tags/{tag_name}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      if resp.status == 200:
                          exists_in_repo = True
                          print(f"ℹ️ Found existing release for tag {tag_name}")
              except Exception:
                  pass

          if exists_in_repo and not force_rebuild:
              print(f"✅ Target {tag_name} already released. Skipping build.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("should_build=false\n")
              sys.exit(0)

          anilist_id = os.environ.get("INPUT_ANILIST_ID") or os.environ.get("SECRET_ANILIST_ID") or ""
          mal_id = os.environ.get("INPUT_MAL_ID") or os.environ.get("SECRET_MAL_ID") or ""

          print(f"🚀 Ready to build target: {tag_name} ({target_source})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("should_build=true\n")
              f.write(f"tag={tag_name}\n")
              f.write(f"commit_sha={commit_sha}\n")
              f.write(f"short_sha={short_sha}\n")
              f.write(f"app_version={app_version}\n")
              f.write(f"prerelease={str(is_prerelease).lower()}\n")
              f.write(f"anilist_client_id={anilist_id}\n")
              f.write(f"mal_client_id={mal_id}\n")
          PYEOF

  build-ipa:
    name: Build Unsigned IPA
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NSUnbufferedIO: "YES"
      GIT_TERMINAL_PROMPT: "0"
      ANILIST_CLIENT_ID: ${{ needs.check-upstream.outputs.anilist_client_id }}
      MAL_CLIENT_ID: ${{ needs.check-upstream.outputs.mal_client_id }}
    steps:
      - name: Checkout AniHyou (${{ needs.check-upstream.outputs.short_sha }})
        uses: actions/checkout@v4
        with:
          repository: axiel7/AniHyou-iOS
          ref: ${{ needs.check-upstream.outputs.commit_sha }}

      - name: Select Xcode & Accept License
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcodebuild -license accept
          xcodebuild -version

          # Skip macro/plugin trust prompts
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Configure App Secrets (.xcconfig)
        run: |
          set -euo pipefail
          mkdir -p AniHyou
          {
            echo "ANILIST_CLIENT_ID = ${ANILIST_CLIENT_ID:-10214}"
            echo "MAL_CLIENT_ID = ${MAL_CLIENT_ID:-}"
          } > AniHyou/Config.xcconfig
          echo "✅ Config.xcconfig configured"

      - name: Prepare Asset Icons
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os, shutil
          # Ensure AppIcon alias matches target pbxproj reference
          for root, dirs, files in os.walk("."):
              if root.endswith(".xcassets"):
                  appicon = os.path.join(root, "AppIcon.appiconset")
                  anihyou = os.path.join(root, "AniHyou.appiconset")
                  if os.path.exists(appicon) and not os.path.exists(anihyou):
                      shutil.copytree(appicon, anihyou)
                      print(f"✅ Prepared {anihyou}")

                  appicons_sub = os.path.join(root, "AppIcons")
                  if os.path.exists(appicons_sub):
                      for item in os.listdir(appicons_sub):
                          if item.startswith("AppIcon-") and item.endswith(".appiconset"):
                              color = item.replace("AppIcon-", "").replace(".appiconset", "")
                              src = os.path.join(appicons_sub, item)
                              dst = os.path.join(appicons_sub, f"AniHyou-{color}.appiconset")
                              if not os.path.exists(dst):
                                  shutil.copytree(src, dst)
                                  print(f"✅ Prepared {dst}")
          PYEOF

      # ─── Pre-resolve SPM to isolate network fetches ───
      - name: Resolve SPM Dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "🔄 Resolving Swift Package Manager dependencies..."
          xcodebuild -resolvePackageDependencies \
            -scheme "AniHyou" \
            -project ./AniHyou.xcodeproj \
            -derivedDataPath "$PWD/build" \
            -disableAutomaticPackageResolution
          echo "✅ SPM dependencies resolved"

      # ─── Build unsigned .app ───
      - name: Build AniHyou
        timeout-minutes: 45
        run: |
          set -euo pipefail

          xcodebuild build \
            -project ./AniHyou.xcodeproj \
            -scheme "AniHyou" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -skipMacroValidation \
            | xcbeautify

          echo "✅ Build completed"

      # ─── Package .app into unsigned IPA ───
      - name: Package Unsigned IPA
        env:
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          set -euo pipefail

          IPA_NAME="AniHyou-${TAG}-unsigned.ipa"

          echo "📦 Locating .app bundle..."

          APP_PATH=$(find "$PWD/build" \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            -not -path "*/PlugIns/*" \
            -maxdepth 7 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "⚠️ Trying broader search..."
            APP_PATH=$(find "$PWD/build" \
              -name "AniHyou.app" -type d \
              -not -path "*/PlugIns/*" \
              -not -path "*Intermediates*" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Failed to find .app. Build contents:"
            find "$PWD/build" -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          echo "Found: $APP_PATH"

          # Strip code signatures for clean unsigned IPA
          codesign --remove-signature "${APP_PATH}" 2>/dev/null || true
          find "${APP_PATH}" \( -name "*.dylib" -o -name "*.framework" -o -name "*.appex" -o -name "*.app" \) -print0 | \
            while IFS= read -r -d '' f; do
              codesign --remove-signature "$f" 2>/dev/null || true
            done

          # Package into IPA
          PAYLOAD_DIR="payload/Payload"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/"

          cd payload
          zip -q -r -y "../${IPA_NAME}" Payload
          cd ..

          ls -lh "${IPA_NAME}"
          echo "🎉 Done: ${IPA_NAME}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: AniHyou-*.ipa
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [check-upstream, build-ipa]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ios-ipa
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          SHORT_SHA: ${{ needs.check-upstream.outputs.short_sha }}
          COMMIT_SHA: ${{ needs.check-upstream.outputs.commit_sha }}
          BRANCH: ${{ needs.check-upstream.outputs.branch }}
          APP_VERSION: ${{ needs.check-upstream.outputs.app_version }}
          IS_PRERELEASE: ${{ needs.check-upstream.outputs.prerelease }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="axiel7/AniHyou-iOS"
          echo "🚀 Publishing Release '$TAG'..."

          COMMIT_MSG=$(gh api "repos/$UPSTREAM_REPO/commits/$COMMIT_SHA" --jq '.commit.message // empty' 2>/dev/null || true)
          RELEASE_TITLE="AniHyou v${APP_VERSION} (${SHORT_SHA})"

          {
            if [ -n "$COMMIT_MSG" ]; then
              echo "$COMMIT_MSG"
              echo ""
              echo "---"
            fi
            echo "**Branch:** \`$BRANCH\`"
            echo "**Version:** \`$APP_VERSION\`"
            echo ""
            echo "Built from upstream commit [\`$SHORT_SHA\`](https://github.com/${UPSTREAM_REPO}/commit/${COMMIT_SHA}) on the \`$BRANCH\` branch."
            echo ""
            echo "### Sideloading"
            echo "- Download \`AniHyou-${TAG}-unsigned.ipa\` below."
            echo "- Sideload using TrollStore, LiveContainer, AltStore, SideStore, Sideloadly, Feather, or Scarlet."
          } > release_notes.md

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true

          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            "${EXTRA_FLAGS[@]}" \
            *.ipa
