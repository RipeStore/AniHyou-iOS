name: Build & Release AniHyou iOS IPA

on:
  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Upstream branch to build from'
        required: false
        type: string
        default: 'main'
      commit:
        description: 'Specific commit SHA to build (overrides branch head)'
        required: false
        type: string
        default: ''
      force_rebuild:
        description: 'Force build even if this commit was already built'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark published release as Pre-release'
        required: false
        type: boolean
        default: false
      anilist_client_id:
        description: 'Custom AniList Client ID (leave empty to use secret or default)'
        required: false
        type: string
        default: ''
      mal_client_id:
        description: 'Custom MyAnimeList Client ID (leave empty to use secret or default)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check-upstream:
    name: Resolve Target & Check Existing
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      branch: ${{ steps.resolve.outputs.branch }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      anilist_client_id: ${{ steps.resolve.outputs.anilist_client_id }}
      mal_client_id: ${{ steps.resolve.outputs.mal_client_id }}
    steps:
      - name: Resolve target commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BRANCH: ${{ inputs.branch || 'main' }}
          INPUT_COMMIT: ${{ inputs.commit }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          IS_PRERELEASE: ${{ inputs.is_prerelease || 'false' }}
          INPUT_ANILIST_ID: ${{ inputs.anilist_client_id }}
          INPUT_MAL_ID: ${{ inputs.mal_client_id }}
          SECRET_ANILIST_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          SECRET_MAL_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="axiel7/AniHyou-iOS"
          CURRENT_REPO="${GITHUB_REPOSITORY}"
          BRANCH="$INPUT_BRANCH"

          echo "🔍 Resolving build target for $UPSTREAM_REPO..."

          if [ -n "$INPUT_COMMIT" ]; then
            COMMIT_SHA="$INPUT_COMMIT"
            echo "Manual commit requested: $COMMIT_SHA"
          else
            # Get the latest commit on the target branch
            COMMIT_SHA=$(gh api "repos/$UPSTREAM_REPO/commits/$BRANCH" --jq '.sha' 2>/dev/null)
            if [ -z "$COMMIT_SHA" ] || [ "$COMMIT_SHA" = "null" ]; then
              echo "❌ Failed to resolve HEAD of branch '$BRANCH'"
              exit 1
            fi
            echo "Latest commit on $BRANCH: $COMMIT_SHA"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          # Extract app version from the project file at this commit
          APP_VERSION=$(gh api "repos/$UPSTREAM_REPO/contents/AniHyou.xcodeproj/project.pbxproj?ref=$COMMIT_SHA" \
            --jq '.content' | base64 -d | grep "MARKETING_VERSION" | head -1 | grep -oP '[\d.]+' || echo "1.0.0")
          echo "App version: $APP_VERSION"

          # Tag format: v{app_version}-{short_sha}
          TAG_NAME="v${APP_VERSION}-${SHORT_SHA}"
          echo "Release tag: $TAG_NAME"

          # Determine client IDs
          ANILIST_ID="${INPUT_ANILIST_ID:-$SECRET_ANILIST_ID}"
          MAL_ID="${INPUT_MAL_ID:-$SECRET_MAL_ID}"

          # Check if we already built this exact commit
          EXISTS_IN_REPO="false"

          # Check by tag
          if gh release view "$TAG_NAME" --repo "$CURRENT_REPO" >/dev/null 2>&1; then
            EXISTS_IN_REPO="true"
          fi

          # Also check if any existing release references this commit SHA
          if [ "$EXISTS_IN_REPO" = "false" ]; then
            EXISTING=$(gh api "repos/$CURRENT_REPO/releases" --paginate --jq ".[].tag_name" 2>/dev/null | grep "$SHORT_SHA" || true)
            if [ -n "$EXISTING" ]; then
              EXISTS_IN_REPO="true"
              echo "Found existing release with this commit: $EXISTING"
            fi
          fi

          if [ "$EXISTS_IN_REPO" = "true" ] && [ "$FORCE_REBUILD" != "true" ]; then
            echo "✅ Commit $SHORT_SHA already built. Skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🚀 Building commit $SHORT_SHA from branch $BRANCH"

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "anilist_client_id=$ANILIST_ID" >> "$GITHUB_OUTPUT"
          echo "mal_client_id=$MAL_ID" >> "$GITHUB_OUTPUT"

  build-ipa:
    name: Build Unsigned IPA
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NSUnbufferedIO: "YES"
      GIT_TERMINAL_PROMPT: "0"
      ANILIST_CLIENT_ID: ${{ needs.check-upstream.outputs.anilist_client_id }}
      MAL_CLIENT_ID: ${{ needs.check-upstream.outputs.mal_client_id }}
    steps:
      - name: Checkout AniHyou (${{ needs.check-upstream.outputs.short_sha }})
        uses: actions/checkout@v4
        with:
          repository: axiel7/AniHyou-iOS
          ref: ${{ needs.check-upstream.outputs.commit_sha }}

      - name: Select Xcode & Accept License
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcodebuild -license accept
          xcodebuild -version

          # Skip macro/plugin trust prompts
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Configure App Secrets (.xcconfig)
        run: |
          set -euo pipefail
          mkdir -p AniHyou
          {
            echo "ANILIST_CLIENT_ID = ${ANILIST_CLIENT_ID:-10214}"
            echo "MAL_CLIENT_ID = ${MAL_CLIENT_ID:-}"
          } > AniHyou/Config.xcconfig
          echo "✅ Config.xcconfig configured"

      - name: Patch Project Settings & Asset Catalogs
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os, glob, re, shutil

          # 1. Fix watchOS deployment target (11.6 -> 11.0)
          pbxproj_path = "AniHyou.xcodeproj/project.pbxproj"
          if os.path.exists(pbxproj_path):
              with open(pbxproj_path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("WATCHOS_DEPLOYMENT_TARGET = 11.6;", "WATCHOS_DEPLOYMENT_TARGET = 11.0;")
              with open(pbxproj_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("✅ Patched project.pbxproj watchOS deployment target to 11.0")

          # 2. Patch PagedResult to conform to @unchecked Sendable for Swift 6 concurrency
          paged_result_path = "AniHyou/Network/PagedResult.swift"
          if os.path.exists(paged_result_path):
              with open(paged_result_path, "r", encoding="utf-8") as f:
                  pr = f.read()
              if "struct PagedResult<Data>" in pr and "@unchecked Sendable" not in pr:
                  pr = re.sub(r'struct\s+PagedResult<Data>(?!\s*:\s*@unchecked\s+Sendable)', 'struct PagedResult<Data>: @unchecked Sendable', pr)
                  with open(paged_result_path, "w", encoding="utf-8") as f:
                      f.write(pr)
                  print("✅ Patched PagedResult to @unchecked Sendable")

          # 3. Patch all repositories to @MainActor for clean Swift 6 actor isolation
          for r_path in glob.glob("AniHyou/Repositories/*.swift"):
              try:
                  with open(r_path, "r", encoding="utf-8") as f:
                      r_code = f.read()
                  new_r_code = re.sub(r'(?<!@MainActor\s)struct\s+(\w+Repository)', r'@MainActor struct \1', r_code)
                  if new_r_code != r_code:
                      with open(r_path, "w", encoding="utf-8") as f:
                          f.write(new_r_code)
                      print(f"✅ Patched @MainActor on {r_path}")
              except Exception as e:
                  print(f"⚠️ Error patching {r_path}: {e}")

          # 4. Fix AppIcon asset catalog naming mismatch (AppIcon -> AniHyou)
          for root, dirs, files in os.walk("."):
              if root.endswith(".xcassets"):
                  appicon = os.path.join(root, "AppIcon.appiconset")
                  anihyou = os.path.join(root, "AniHyou.appiconset")
                  if os.path.exists(appicon) and not os.path.exists(anihyou):
                      shutil.copytree(appicon, anihyou)
                      print(f"✅ Created {anihyou} from {appicon}")

                  appicons_sub = os.path.join(root, "AppIcons")
                  if os.path.exists(appicons_sub):
                      for item in os.listdir(appicons_sub):
                          if item.startswith("AppIcon-") and item.endswith(".appiconset"):
                              color = item.replace("AppIcon-", "").replace(".appiconset", "")
                              src = os.path.join(appicons_sub, item)
                              dst = os.path.join(appicons_sub, f"AniHyou-{color}.appiconset")
                              if not os.path.exists(dst):
                                  shutil.copytree(src, dst)
                                  print(f"✅ Created {dst} from {src}")
          PYEOF

      # ─── Pre-resolve SPM to isolate network fetches & patch dependencies ───
      - name: Resolve & Patch SPM Dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "🔄 Resolving Swift Package Manager dependencies..."
          xcodebuild -resolvePackageDependencies \
            -scheme "AniHyou" \
            -project ./AniHyou.xcodeproj \
            -derivedDataPath "$PWD/build" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -disableAutomaticPackageResolution
          echo "✅ SPM dependencies resolved"

          # Ensure all checked out files are writable
          chmod -R u+w "$PWD/build" 2>/dev/null || true

          # Fix 'nonisolated deinit' in SPM packages (e.g. Nuke) under Swift 6 compiler
          python3 - << 'PYEOF'
          import os, glob, re, stat
          search_roots = [
              os.path.abspath("build"),
              os.path.expanduser("~/Library/Developer/Xcode/DerivedData"),
              os.path.expanduser("~/Library/Caches/org.swift.swiftpm"),
              os.path.abspath(".")
          ]
          patched = 0
          for base in search_roots:
              if os.path.exists(base):
                  for root, dirs, files in os.walk(base):
                      for file in files:
                          if file.endswith(".swift"):
                              fpath = os.path.join(root, file)
                              try:
                                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                                      content = f.read()
                                  if "nonisolated deinit" in content:
                                      new_content = re.sub(r'\bnonisolated\s+deinit\b', 'deinit', content)
                                      try:
                                          os.chmod(fpath, stat.S_IRWXU | stat.S_IRWXG | stat.S_IRWXO)
                                      except Exception:
                                          pass
                                      with open(fpath, "w", encoding="utf-8") as f:
                                          f.write(new_content)
                                      patched += 1
                                      print(f"✅ Patched nonisolated deinit in: {fpath}")
                              except Exception as e:
                                  print(f"⚠️ Warning patching {fpath}: {e}")
          print(f"✅ Patched 'nonisolated deinit' across {patched} files")
          PYEOF

      # ─── Build unsigned .app ───
      - name: Build AniHyou
        timeout-minutes: 45
        run: |
          set -euo pipefail

          xcodebuild build \
            -project ./AniHyou.xcodeproj \
            -scheme "AniHyou" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            -skipMacroValidation \
            | xcbeautify

          echo "✅ Build completed"

      # ─── Package .app into unsigned IPA ───
      - name: Package Unsigned IPA
        env:
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          set -euo pipefail

          IPA_NAME="AniHyou-${TAG}-unsigned.ipa"

          echo "📦 Locating .app bundle..."

          APP_PATH=$(find "$PWD/build" \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            -not -path "*/PlugIns/*" \
            -maxdepth 7 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "⚠️ Trying broader search..."
            APP_PATH=$(find "$PWD/build" \
              -name "AniHyou.app" -type d \
              -not -path "*/PlugIns/*" \
              -not -path "*Intermediates*" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Failed to find .app. Build contents:"
            find "$PWD/build" -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          echo "Found: $APP_PATH"

          # Strip code signatures for clean unsigned IPA
          codesign --remove-signature "${APP_PATH}" 2>/dev/null || true
          find "${APP_PATH}" \( -name "*.dylib" -o -name "*.framework" -o -name "*.appex" -o -name "*.app" \) -print0 | \
            while IFS= read -r -d '' f; do
              codesign --remove-signature "$f" 2>/dev/null || true
            done

          # Package into IPA
          PAYLOAD_DIR="payload/Payload"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/"

          cd payload
          zip -q -r -y "../${IPA_NAME}" Payload
          cd ..

          ls -lh "${IPA_NAME}"
          echo "🎉 Done: ${IPA_NAME}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: AniHyou-*.ipa
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [check-upstream, build-ipa]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ios-ipa
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          SHORT_SHA: ${{ needs.check-upstream.outputs.short_sha }}
          COMMIT_SHA: ${{ needs.check-upstream.outputs.commit_sha }}
          BRANCH: ${{ needs.check-upstream.outputs.branch }}
          APP_VERSION: ${{ needs.check-upstream.outputs.app_version }}
          IS_PRERELEASE: ${{ needs.check-upstream.outputs.prerelease }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="axiel7/AniHyou-iOS"
          echo "🚀 Publishing Release '$TAG'..."

          COMMIT_MSG=$(gh api "repos/$UPSTREAM_REPO/commits/$COMMIT_SHA" --jq '.commit.message // empty' 2>/dev/null || true)
          RELEASE_TITLE="AniHyou v${APP_VERSION} (${SHORT_SHA})"

          {
            if [ -n "$COMMIT_MSG" ]; then
              echo "$COMMIT_MSG"
              echo ""
              echo "---"
            fi
            echo "**Branch:** \`$BRANCH\`"
            echo "**Version:** \`$APP_VERSION\`"
            echo ""
            echo "Built from upstream commit [\`$SHORT_SHA\`](https://github.com/${UPSTREAM_REPO}/commit/${COMMIT_SHA}) on the \`$BRANCH\` branch."
            echo ""
            echo "### Sideloading"
            echo "- Download \`AniHyou-${TAG}-unsigned.ipa\` below."
            echo "- Sideload using TrollStore, LiveContainer, AltStore, SideStore, Sideloadly, Feather, or Scarlet."
          } > release_notes.md

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true

          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            "${EXTRA_FLAGS[@]}" \
            *.ipa
